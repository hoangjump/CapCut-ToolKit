<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeamHatDe-Auto</title>
  <style>
    :root {
      color: #111827;
      background: #f7f8fb;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .panel {
      width: min(420px, calc(100vw - 48px));
      padding: 28px;
      border: 1px solid #dfe4ec;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 18px 60px rgba(15, 23, 42, .08);
    }
    .brand {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .status {
      color: #4b5563;
      line-height: 1.55;
      margin-bottom: 22px;
    }
    .bar {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5e7eb;
    }
    .bar::before {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #111827;
      animation: load 1.25s ease-in-out infinite;
    }
    @keyframes load {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">TeamHatDe-Auto</div>
    <div class="status" id="status">Đang khởi động...</div>
    <div class="bar" aria-hidden="true"></div>
    <div class="hint" id="hint" style="color:#9aa3b2;font-size:12px;line-height:1.5;margin-top:14px;display:none"></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const status = params.get('status');
    if (status) document.getElementById('status').textContent = status;
    // Lần đầu tải Camoufox (~100MB) mất vài phút — báo rõ để không tưởng treo.
    if (status && /Camoufox/i.test(status)) {
      const hint = document.getElementById('hint');
      hint.textContent = 'Lần chạy đầu tải trình duyệt (~100MB), có thể mất vài phút tùy mạng. Cửa sổ sẽ tự mở khi xong.';
      hint.style.display = 'block';
    }
  </script>
</body>
</html>
