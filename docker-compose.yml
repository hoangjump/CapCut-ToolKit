services:
  proxy-manager:
    build: .
    image: teamhatde-auto
    container_name: capcut-proxy-manager
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Endpoint dùng để xác nhận proxy thực sự định tuyến (trả JSON {ip}).
      PROXY_CHECK_URL: "${PROXY_CHECK_URL:-https://api.ipify.org?format=json}"
    volumes:
      # Bind mount thư mục local ./profiles-store vào /data (STORE_ROOT trong
      # container). Nhờ vậy chạy npm (STORE_ROOT=./profiles-store) và chạy Docker
      # dùng CHUNG một kho: project/mail/proxy/settings hiện đầy đủ ở cả hai.
      - ./profiles-store:/data
    restart: unless-stopped
