stages:
  - test
  - build

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  NPM_CONFIG_CACHE: '$CI_PROJECT_DIR/.npm'

cache:
  key:
    files:
      - package-lock.json
      - web/package-lock.json
  paths:
    - .npm/

test:
  stage: test
  image: node:24-bookworm
  script:
    - npm ci
    - npm ci --prefix web
    - npm test
    - npm run typecheck
    - npm run lint
    - npm run build --prefix web

build_windows:
  stage: build
  image: electronuserland/builder:wine
  needs:
    - test
  script:
    - npm ci
    - npm ci --prefix web
    - npm run build
    - npm run build --prefix web
    - npx electron-builder --win --publish never
  artifacts:
    name: 'TeamHatDe-Auto-Windows-$CI_COMMIT_SHORT_SHA'
    expire_in: 14 days
    paths:
      - release/*.exe
      - release/*.blockmap
      - release/latest.yml
